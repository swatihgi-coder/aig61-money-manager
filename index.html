function planKpis(c){ const fp=c.needTotal?c.fundedTotal/c.needTotal:1, gap=c.needTotal-c.fundedTotal;
  return `${kcard("Monthly plan budget","wallet",$f(c.budget),S.goals.monthlyBudget>0?"Set in your goals":"Using your monthly surplus")}${kcard("Plan needs","plan",$f(c.needTotal),`${c.actions.length} priorities per month`)}${kcard("Funded today","check",$f(c.fundedTotal),pill(fp>=1?"good":fp>=.5?"warn":"bad",pct(fp)+" of plan"),"hero")}${kcard("Gap","pct",gap>1?"−"+$f(gap):$f(0),gap>1?"Short of fully funding the plan":"Fully funded",gap>1?"negv neg-tint":"hero")}`; }
function pageplan(){
  if(!hasData()) return emptyState();
  const c=calc(), mx=Math.max(Math.ceil(Math.max(c.needTotal,c.surplus,c.budget)*1.1/100)*100,500);
  return `<div style="display:grid;gap:22px">
  <div class="kpis k4" id="planKpis">${planKpis(c)}</div>
  <div class="grid12">
    <section class="card s8"><div class="ch"><div><h3>Priorities funded by your budget</h3><div class="sub">Ordered by your goals: ${esc((S.goals.priorities||[]).join(", ")||"default order")} · timeline ${esc(S.goals.horizon)}</div></div></div><div id="planChartBox">${planChart(c)}</div></section>
    <section class="card s4 gold"><div class="ch"><h3 class="serif" style="font-size:21px">What if…</h3><button class="btn-link" data-act="usesurplus">Use full surplus</button></div>
      <div class="hb"><div class="hb-l"><span>Monthly plan budget</span><b class="num pos" id="wiVal">${$f(c.budget)}/mo</b></div>
      <input type="range" id="f-budget-slider" min="0" max="${mx}" step="25" value="${Math.round(c.budget)}" style="--p:${c.budget/mx*100}%" aria-label="Monthly plan budget"><div class="hb-l"><span class="hint">$0/mo</span><span class="hint">${$f(mx)}/mo</span></div></div>
      <div id="wiResult">${wiResult(c)}</div>
      <p class="hint">Moving the slider updates your saved plan budget. Your monthly surplus today is ${$f(c.surplus)}.</p></section>
    <section class="card s12"><div class="ch"><h3>Action timeline</h3></div>${timelineHTML(c)}</section>
  </div><p class="disc">*Rough illustrative estimates; actual premiums vary. Not financial advice.</p></div>`; }
function wiResult(c){ const gap=c.needTotal-c.fundedTotal; return gap>1?`<div class="callbox neg"><span>Monthly result: <b class="neg num">−${$f(gap)}</b> short of fully funding every priority.</span></div>`:`<div class="callbox good"><span>Monthly result: every priority is funded${c.budget-c.fundedTotal>1?`, with <b class="num">${$f(c.budget-c.fundedTotal)}</b> to spare`:""}.</span></div>`; }

/* ---------- reports ---------- */
function fullReportHTML(){
  const c=calc(), R=recs(c), gapTotal=sum(c.people.map(x=>x.gap)), affordPct=c.needTotal?c.fundedTotal/c.needTotal:1;
  const M=[["cash","Cash flow",`${pct(c.savingsRate)} saved`,c.surplus>=0?`${$f(c.surplus)} monthly surplus`:`${$f(-c.surplus)} monthly shortfall`],["emergency","Emergency fund",`${c.emMonths.toFixed(1)} months`,`Goal 6 months · ${$f(c.efTarget)}`],["debt","Debt",`${pct(c.dti)} DTI`,"Housing + debt ÷ gross income"],["protection","Family protection",pct(c.protScore)+" covered",`Gap ${$k(gapTotal)}`],["education","College",c.kids.length?pct(c.eduTarget?c.eduProj/c.eduTarget:1)+" funded":"—",c.kids.length?`Gap ${$k(sum(c.ckids.map(k=>k.gap)))}`:"No children listed"],["retirement","Retirement",pct(c.retTarget?Math.min(1,c.retProj/c.retTarget):1)+" on track",`Gap ${$k(c.retGap)}`],["estate","Estate plan",`${c.estDone} of ${c.estItems.length}`,"Documents in place"]];
  return `<div style="display:grid;gap:20px">
  <section class="card"><div class="feat">${ringSVG(c.score,180)}<div style="display:grid;gap:10px;min-width:0"><span class="eyebrow">Financial health checkup · ${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</span>
    <h2 class="serif" style="font-size:34px">${esc(famName())}: ${grade(c.score)}</h2>
    <p class="muted" style="font-size:15.5px;max-width:52em">${c.score>=70?"You've built a solid base. A few focused moves will make it stronger.":c.score>=50?"You have real strengths, and a clear plan will close the gaps that matter most.":"There are important gaps to close, and the plan below shows exactly where to start."} ${c.actions.length?`Your plan has <b>${c.actions.length} priorities</b> and fits <b>${pct(affordPct)}</b> into your ${$f(c.budget)}/month budget today.`:""}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${S.profile.kids.length?pill("na",`${S.profile.kids.length} ${S.profile.kids.length>1?"children":"child"}`):""}${pill("na",$f(c.grossAnnual)+" household income")}${pill("na","Net worth "+$k(netWorth().net))}</div></div></div></section>
  <div class="goals" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${M.map(([k,l,v,s])=>{ const t=toneScore(c.sc[k]); return `<div class="gcard"><div class="gh"><b>${l}</b>${pill(t,status(c.sc[k])[1])}</div><span class="serif num" style="font-size:24px">${v}</span><span class="hint">${s}</span></div>`; }).join("")}</div>
  <div class="grid12">
    <section class="card s5"><h3>What you're doing well</h3><ul class="wins">${wins(c).map(w=>`<li><span class="ck">${icon("check",12)}</span>${esc(w)}</li>`).join("")}</ul></section>
    <section class="card s7"><h3>Recommendations</h3><div class="recs">${R.map(([t,h,b],i)=>`<div class="rec"><span class="n ${t}">${i+1}</span><div><h4>${esc(h)}</h4><p>${esc(b)}</p></div></div>`).join("")||"<p>No major gaps found.</p>"}</div></section>
    <section class="card s12"><div class="ch"><h3>DIME protection analysis</h3><span class="muted" style="font-size:12.5px">${c.yrs} years of income replacement</span></div>
      <div class="tbl"><table><thead><tr><th>Person</th><th class="r">DIME need</th><th class="r">− Assets</th><th class="r">− Insurance</th><th class="r">Gap</th><th class="r">Est. term cost*</th></tr></thead><tbody>
      ${c.people.map(x=>`<tr><td><b>${esc(x.who)}</b></td><td class="r num">${$f(x.need)}</td><td class="r num">${$f(Math.min(x.need,x.liquid))}</td><td class="r num">${$f(x.cover)}</td><td class="r num ${x.gap?"neg":"pos"}"><b>${$f(x.gap)}</b></td><td class="r num">${x.gap?$f(termEstimate(x.gap,x.age))+"/mo":"—"}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="card s12"><div class="ch"><h3>Your next plan & affordability</h3>${pill(affordPct>=1?"good":affordPct>=.5?"warn":"bad",pct(affordPct)+" funded")}</div>${planChart(c)}</section>
    <section class="card s12"><h3>Action timeline</h3>${timelineHTML(c)}</section>
    <section class="card s12"><h3>Estate planning checklist</h3><div class="facts f3">${c.estItems.map(([k,t])=>`<div style="display:flex;gap:10px;align-items:center">${S.estate[k]?pill("good","Done"):pill("bad","To do")}<span>${t}</span></div>`).join("")}</div></section>
  </div>
  <section class="cta"><div style="display:grid;gap:6px;max-width:36em"><h3>Want help putting this plan in place?</h3><p>Book a free 30-minute review with a licensed professional at ${esc(ADVISOR.org)}. Bring this report.</p></div>
    <div style="display:grid;gap:6px;justify-items:start"><span class="eyebrow" style="color:#C9D6CC">Call or text</span><span class="phone">${esc(ADVISOR.phone)}</span><button class="btn btn-gold btn-sm" data-act="copyphone">Copy number</button></div></section>
  <p class="disc">*Insurance and disability costs are rough illustrative estimates for a healthy non-smoker; actual premiums depend on health, age, product and carrier. Projections use assumed growth and inflation rates and are not guaranteed. This report is for educational purposes and is not financial, tax or legal advice.</p></div>`; }
function sheetHTML(){
  const sheets=sheetData(); sheetTab=Math.min(sheetTab,sheets.length-1); const sh=sheets[sheetTab];
  const ncol=Math.max(...sh.rows.map(r=>r.length),sh.cols.length), letters="ABCDEFGH", nrows=Math.max(sh.rows.length+3,18);
  let body=""; for(let r=0;r<nrows;r++){ const row=sh.rows[r]||[]; body+=`<tr><th class="rn">${r+1}</th>${Array.from({length:ncol},(_,ci)=>{ const x=row[ci]; const num=x&&typeof x==="object"&&typeof x.v==="number"; const cls=[num?"r":"",x?.b?"b":"",x?.h?"hd":"",num&&x.v<0?"neg":""].join(" "); return `<td class="${cls}">${cellText(x)}</td>`; }).join("")}</tr>`; }
  return `<div class="sheetwrap"><div class="xl"><div class="xl-bar">${icon("sheet",16)}<b>${esc(sh.name)}</b><span class="muted">${esc(famName())} · values from your checkup</span></div>
    <div class="xl-grid"><table><thead><tr><th class="rn"></th>${Array.from({length:ncol},(_,i)=>`<th style="min-width:${(sh.cols[i]||14)*7.5}px">${letters[i]}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="xl-tabs" role="tablist">${sheets.map((s2,i)=>`<button role="tab" data-sheet="${i}" aria-selected="${i===sheetTab}">${esc(s2.name)}</button>`).join("")}</div></div>
    <aside class="card xl-chart">${sh.chart().replace(/<h4>/,'<h3>').replace(/<\/h4>/,'</h3>')}</aside></div>`; }
function pageReport(){
  if(!hasData()) return emptyState();
  return `<div style="display:grid;gap:20px"><div class="ch"><div class="seg dark" role="tablist"><button data-rtab="full" aria-pressed="${reportTab==="full"}">Full report</button><button data-rtab="sheet" aria-pressed="${reportTab==="sheet"}">Spreadsheet view</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${account.dl?`<button class="btn btn-ghost btn-sm" data-act="xlsx">${icon("down",15)} Download Excel</button>`:""}<button class="btn btn-primary btn-sm" data-act="savehist">${icon("save",15)} Save to history</button></div></div>
    ${reportTab==="sheet"?sheetHTML():fullReportHTML()}</div>`; }

/* ---------- auth ---------- */
function authHTML(){
  const ready=account.mode!==null; const ex=(()=>{ const keep=S; S=sample(); const c=calc(); S=keep; return c; })();
  return `<div class="auth"><section class="auth-l">
    <div class="logo"><span class="mark"><span>M</span></span><span class="wm">MoneyManager</span></div>
    <div style="display:grid;gap:18px;margin-top:auto"><span class="eyebrow" style="color:#D9B54A">Personal financial checkup</span><h1>Become your own <em>money manager</em>.</h1>
    <p class="lede">Answer simple questions about your family, income and goals. MoneyManager runs a full DIME analysis, checks protection, college and retirement, and hands you a dashboard and a plan you can afford.</p></div>
    <ol>${STEPS.map((s,i)=>`<li><span>${i+1}</span>${s.t}</li>`).join("")}<li><span>★</span>Your dashboard & report</li></ol>
    <p style="margin-top:auto;font-size:12.5px;color:#9FB5A6">Educational tool · not financial advice</p></section>
  <section class="auth-r"><div class="signin">
    ${authPanel()}
    ${authView==="login"||authView==="register"?`<div class="sample">${ringSVG(ex.score,92)}<div><span class="pill warn">Example</span><p style="margin-top:6px;font-size:13.5px"><b>The Mitchell family</b> scored ${ex.score}/100 with a ${$k(sum(ex.people.map(x=>x.gap)))} protection gap and a ${ex.actions.length}-step plan.</p></div></div>`:""}
  </div></section></div>`; }

/* ---------- render ---------- */
const PAGES={dashboard:pageDashboard,checkup:pageCheckup,cashflow:pageCashflow,protection:pageProtection,goals:pageGoals,networth:pageNetworth,plan:pageplan,report:pageReport};
function render(keepScroll){
  const y=window.scrollY, root=$("#root");
  if(view==="auth") root.innerHTML=authHTML();
  else root.innerHTML=shell(view,PAGES[view]());
  window.scrollTo({top:keepScroll?y:0});
}
function nav(p){ view=p; menuOpen=false; if(p==="checkup") maxStep=Math.max(maxStep,step); render(); }

/* ---------- Events ---------- */
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="f-budget-slider"){ S.goals.monthlyBudget=+el.value||0; const c=calc(); el.style.setProperty("--p",(+el.value/(+el.max||1)*100)+"%");
    $("#wiVal").textContent=$f(c.budget)+"/mo"; $("#planChartBox").innerHTML=planChart(c); $("#planKpis").innerHTML=planKpis(c); $("#wiResult").innerHTML=wiResult(c); scheduleSave(); return; }
  const path=el.dataset?.path; if(!path) return;
  const v = el.dataset.kind==="num"? (Number(String(el.value).replace(/[^0-9.\-]/g,""))||0) : el.dataset.kind==="bool"? el.checked : el.value;
  setP(path,v);
  if(el.hasAttribute("data-rerender")) render(true); else refreshLive();
  scheduleSave();
});
document.addEventListener("change",e=>{ const el=e.target; if(el.dataset?.path && el.tagName==="SELECT"){ setP(el.dataset.path,el.value); if(el.hasAttribute("data-rerender")) render(true); else refreshLive(); scheduleSave(); }});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&menuOpen){ menuOpen=false; render(true); } });
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-act]"); if(!b) return;
  if(b.dataset.nav){ nav(b.dataset.nav); return; }
  if(b.dataset.go!==undefined){ go(+b.dataset.go); return; }
  if(b.dataset.rtab){ reportTab=b.dataset.rtab; render(true); return; }
  if(b.dataset.sheet!==undefined){ sheetTab=+b.dataset.sheet; render(true); return; }
  if(b.dataset.cf){ cfTab=b.dataset.cf; render(true); return; }
  if(b.dataset.themeSet){ document.documentElement.dataset.theme=b.dataset.themeSet; try{ localStorage.setItem("mm:theme",b.dataset.themeSet); }catch(err){} render(true); return; }
  if(b.dataset.chip){ const arr=getP(b.dataset.chip)||[]; const v=b.dataset.val; const i=arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); setP(b.dataset.chip,arr); b.setAttribute("aria-pressed",i<0); refreshLive(); scheduleSave(); return; }
  if(b.dataset.seg){ setP(b.dataset.seg,b.dataset.val); if(b.dataset.val==="yes"&&!S.insurance.policies.length) S.insurance.policies.push({owner:"primary",type:"Term",face:0,premium:0,yearsLeft:0}); render(true); scheduleSave(); return; }
  const a=b.dataset.act; if(!a) return;
  ({
    menu: ()=>{ menuOpen=!menuOpen; render(true); },
    recheck: ()=>{ account={mode:null}; render(); boot(); },
    enter: async()=>{ if(account.mode!=="cloud") return; await loadData(); view="dashboard"; render(); },
    start: ()=>go(0),
    next: ()=>go(step+1),
    back: ()=>go(step-1),
    finish: ()=>{ maxStep=STEPS.length-1; scheduleSave(); nav("dashboard"); toast("Your financial dashboard and report are ready"); },
    addkid: ()=>{ S.profile.kids.push({name:"",age:""}); render(true); scheduleSave(); },
    delkid: ()=>{ const i=+b.dataset.i; S.profile.kids.splice(i,1); S.college.kids.splice(i,1); render(true); scheduleSave(); },
    addpol: ()=>{ S.insurance.policies.push({owner:"primary",type:"Term",face:0,premium:0,yearsLeft:0}); render(true); scheduleSave(); },
    delpol: ()=>{ S.insurance.policies.splice(+b.dataset.i,1); render(true); scheduleSave(); },
    loadsample: ()=>{ const doIt=()=>{ S=sample(); maxStep=STEPS.length-1; step=0; scheduleSave(); nav("dashboard"); toast("Example family loaded. Replace with your own numbers anytime."); };
      hasData()? confirmBox("Replace your answers?","This fills every step with an example family and replaces what you've entered.","Use example",doIt) : doIt(); },
    newplan: ()=>confirmBox("Start a new checkup?","This clears your current answers. Your score history is kept.","Start over",()=>{ S=blank(); step=0; maxStep=0; go(0); }),
    usesurplus: ()=>{ S.goals.monthlyBudget=0; scheduleSave(); render(true); toast("Plan budget now uses your full monthly surplus"); },
    savehist: saveHistory,
    xlsx: ()=>exportXlsx(b),
    copyphone: ()=>{ navigator.clipboard?.writeText(ADVISOR.phone).then(()=>toast("Number copied"),()=>toast(ADVISOR.phone)); }
  })[a]?.();
});
/* ---------- Website auth events ---------- */
document.addEventListener("submit",e=>{ const f=e.target.dataset?.form; if(!f) return; e.preventDefault(); authSubmit(f,e.target.querySelector("button[type=submit]")); });
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-auth],[data-eye],[data-act='signout']"); if(!b) return;
  if(b.dataset.eye){ const i=$("#"+b.dataset.eye); if(i){ i.type=i.type==="password"?"text":"password"; b.setAttribute("aria-label",i.type==="password"?"Show password":"Hide password"); } return; }
  if(b.dataset.act==="signout"){ signOut(); return; }
  const a=b.dataset.auth;
  if(a==="resend") resendCode(); else goAuth(a);
});
document.addEventListener("input",e=>{
  const el=e.target; if(el.dataset?.otpi===undefined) return;
  el.value=el.value.replace(/\D/g,"").slice(-1);
  if(el.value){ const n=$("#otp-"+(+el.dataset.otpi+1)); if(n) n.focus(); else if(otpValue().length===6){ const f=el.closest("form"); if(f&&f.dataset.form==="verify") f.requestSubmit(); } }
});
document.addEventListener("keydown",e=>{ const el=e.target; if(el.dataset?.otpi!==undefined && e.key==="Backspace" && !el.value){ const p=$("#otp-"+(+el.dataset.otpi-1)); if(p){ p.focus(); p.value=""; } } });
document.addEventListener("paste",e=>{ const el=e.target; if(el.dataset?.otpi===undefined) return; const t=(e.clipboardData?.getData("text")||"").replace(/\D/g,"").slice(0,6); if(!t) return; e.preventDefault(); [...t].forEach((d,i)=>{ const x=$("#otp-"+i); if(x) x.value=d; }); ($("#otp-"+Math.min(t.length,5))||el).focus(); });

/* ---------- Boot ---------- */
async function boot(){
  try{ const t=localStorage.getItem("mm:theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
  account={mode:null,dl:{save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); return {status:"saved"}; }}};
  render();
  if(!sb){ account.mode="none"; render(); return; }
  try{
    const {data}=await sb.auth.getSession();
    if(data?.session){ await onSignedIn(data.session); return; }
  }catch(e){ account.mode="none"; render(); toast("Can't reach the server right now. Check your connection and reload."); return; }
  account.mode="none"; render();
  sb.auth.onAuthStateChange((evt)=>{ if(evt==="SIGNED_OUT" && account.mode==="cloud"){ S=blank(); history=[]; account={mode:"none",dl:account.dl}; view="auth"; authView="login"; render(); } });
}
boot();

</script>
</body>
</html>
