<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MoneyManager: a personal financial checkup with DIME analysis, retirement and college planning, and an affordable action plan.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230F3D2C'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23D9B54A'>M</text></svg>">
<title>MoneyManager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — fixed left sidebar (nav + account), top bar with serif page title, 12-column card grid content. Warm paper ground, white cards, forest green + gold. */
:root{
  --bg:#F6F5F0; --surface:#FFFFFF; --sunk:#F2F1EB; --track:#ECEAE3; --line:#E6E4DC; --line2:#EFEDE6;
  --ink:#1A1E1B; --ink2:#3A3F3B; --muted:#6C716B; --faint:#9A9E97;
  --primary:#0F3D2C; --primary-ink:#FFFFFF; --primary-hover:#155038;
  --hero:#0F3D2C;             /* big serif numbers */
  --pos:#1E7A4C; --pos-bg:#E5F1E8;
  --neg:#C2453A; --neg-bg:#F9E5E2;
  --gold:#C9A12B; --gold-ink:#8A6A10; --gold-bg:#F6EED7; --gold-line:#E6CF8C;
  --nav-on:#E4F0E7;
  --c1:#0F3D2C; --c2:#1E7A4C; --c3:#4FA676; --c4:#A9D3B8; --c5:#C9A12B; --c6:#E3CB7E; --c7:#CFCDC4; --c8:#E6E4DC;
  --shadow:0 1px 2px rgba(20,30,24,.04),0 2px 10px rgba(20,30,24,.04);
  --f-serif:"Fraunces", Georgia, "Times New Roman", serif;
  --f-sans:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#161B18; --sunk:#1B211D; --track:#252C27; --line:#262E29; --line2:#202722;
  --ink:#E9ECE7; --ink2:#CBD1CA; --muted:#98A097; --faint:#6E766E;
  --primary:#2E8F5C; --primary-ink:#FFFFFF; --primary-hover:#35A068; --hero:#8FD3AB;
  --pos:#5CC08A; --pos-bg:#16301F; --neg:#EE8174; --neg-bg:#3A1D1A;
  --gold:#D8B243; --gold-ink:#E6C766; --gold-bg:#2E2814; --gold-line:#5E4E1C; --nav-on:#1C3326;
  --c1:#2E8F5C; --c2:#4FB27A; --c3:#7FCB9E; --c4:#3B5E48; --c5:#D8B243; --c6:#8D7531; --c7:#4A524C; --c8:#2E3631;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#161B18; --sunk:#1B211D; --track:#252C27; --line:#262E29; --line2:#202722;
  --ink:#E9ECE7; --ink2:#CBD1CA; --muted:#98A097; --faint:#6E766E;
  --primary:#2E8F5C; --primary-ink:#FFFFFF; --primary-hover:#35A068; --hero:#8FD3AB;
  --pos:#5CC08A; --pos-bg:#16301F; --neg:#EE8174; --neg-bg:#3A1D1A;
  --gold:#D8B243; --gold-ink:#E6C766; --gold-bg:#2E2814; --gold-line:#5E4E1C; --nav-on:#1C3326;
  --c1:#2E8F5C; --c2:#4FB27A; --c3:#7FCB9E; --c4:#3B5E48; --c5:#D8B243; --c6:#8D7531; --c7:#4A524C; --c8:#2E3631;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:var(--f-serif);font-weight:500;letter-spacing:-.01em;font-variation-settings:"opsz" 72}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.ic{flex:none}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));gap:6px;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border:0;background:none;text-align:left}
.logo .mark{width:34px;height:34px;border-radius:8px;background:#0F3D2C;display:grid;place-items:center;flex:none}
.logo .mark span{font-family:var(--f-serif);font-weight:600;color:#D9B54A;font-size:21px;line-height:1;margin-top:1px}
.logo .wm{font-family:var(--f-serif);font-size:20px;font-weight:500;letter-spacing:-.01em}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 12px;border-radius:9px;font-size:14.5px;color:var(--ink2);text-align:left;font-weight:500}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--nav-on);color:var(--ink);font-weight:600}
.nav button .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.side-foot{margin-top:auto;display:grid;gap:8px}
.mini{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.35;min-width:0}
.mini b{display:block;font-size:13px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{color:var(--muted)}
.mini .av{width:30px;height:30px;border-radius:50%;background:var(--gold-bg);color:var(--gold-ink);display:grid;place-items:center;font-weight:600;flex:none}
.mini.user{background:var(--surface)}
.scrim{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.top h1{font-family:var(--f-serif);font-size:27px;font-weight:500;letter-spacing:-.015em;margin-right:6px}
.menu-btn{display:none}
.pillbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:7px;background:var(--pos-bg);color:var(--pos);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.sync.busy{background:var(--gold-bg);color:var(--gold-ink)}.sync.busy i{background:var(--gold)}
.sync.err{background:var(--neg-bg);color:var(--neg)}.sync.err i{background:var(--neg)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.theme{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px}
.theme button{border:0;background:none;width:30px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.content{padding-block:26px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--sunk)}
.btn-gold{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold-ink)}
.btn-danger{background:var(--neg);color:#fff}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-link{background:none;border:0;color:var(--pos);font-weight:600;padding:2px 0;font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.btn:disabled{opacity:.6;cursor:default}

/* ---------- cards & grid ---------- */
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);display:grid;gap:16px;align-content:start;min-width:0}
.card.gold{border-color:var(--gold-line)}
.card.tint-gold{background:var(--gold-bg);border-color:var(--gold-line)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ch h3{font-size:16px;font-weight:600}
.ch .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ch h2.serif{font-size:26px}
.greet h2{font-family:var(--f-serif);font-size:34px;font-weight:500;letter-spacing:-.02em}
.greet p{color:var(--muted);margin-top:4px}
.summary-line{color:var(--muted);font-size:14.5px;display:flex;gap:18px;flex-wrap:wrap}
.summary-line b{color:var(--ink)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:8px;min-width:0}
.kcard.neg-tint{background:var(--neg-bg);border-color:transparent}
.kh{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px;gap:8px}
.kv{font-family:var(--f-serif);font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:lining-nums tabular-nums}
.kv.hero{color:var(--hero)}
.kv.negv{color:var(--neg)}
.kf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.4}
.pill.good{background:var(--pos-bg);color:var(--pos)}
.pill.warn{background:var(--gold-bg);color:var(--gold-ink)}
.pill.bad{background:var(--neg-bg);color:var(--neg)}
.pill.na{background:var(--sunk);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--ink2);white-space:nowrap}

/* bars */
.bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c2)}
.bar i.good{background:var(--c2)}.bar i.warn{background:var(--gold)}.bar i.bad{background:var(--neg)}
.bar.lg{height:10px}
.hatch{background:repeating-linear-gradient(-45deg,var(--gold) 0 3px,transparent 3px 7px)!important;box-shadow:inset 0 0 0 1px var(--gold)}
.hb{display:grid;gap:7px}
.hb-l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:500}
.hb-l b{font-weight:600}
.stackbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--track);gap:2px}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ring */
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rc b{font-family:var(--f-serif);font-weight:500;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.ring .rc span{color:var(--muted);font-size:12.5px;margin-top:4px}

/* featured */
.feat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center}
.feat h2{font-family:var(--f-serif);font-size:26px;font-weight:500;letter-spacing:-.015em}
.big{font-size:24px;font-weight:600;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px}
.facts.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fact span{display:block;font-size:12.5px;color:var(--muted)}
.fact b{font-size:15px;font-weight:600}
.callbox{border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px}
.callbox.neg{background:var(--neg-bg)}.callbox.gold{background:var(--gold-bg)}.callbox.good{background:var(--pos-bg)}
.callbox .big{font-size:22px}
.callbox.neg .big{color:var(--neg)}

/* donut */
.donut{position:relative}
.donut svg{width:100%;height:100%}
.donut .dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .dc b{font-family:var(--f-serif);font-size:24px;font-weight:500}
.donut .dc span{font-size:12px;color:var(--muted)}
.dleg{display:grid;gap:9px;font-size:13.5px}
.dleg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto 50px;gap:10px;align-items:center}
.dleg i{width:10px;height:10px;border-radius:3px}
.dleg .p{color:var(--muted);text-align:right}

/* tables */
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.r,th.r{text-align:right}
td b{font-weight:600}
tr.total td{border-bottom:0;font-weight:600;background:var(--sunk)}
.cat{display:flex;align-items:center;gap:10px}
.chip-ic{width:30px;height:30px;border-radius:8px;background:var(--pos-bg);color:var(--pos);display:grid;place-items:center;flex:none}
.chip-ic.gold{background:var(--gold-bg);color:var(--gold-ink)}

/* goal cards */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gcard{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;background:var(--surface);align-content:start}
.gcard .gh{display:flex;align-items:center;gap:10px}
.gcard .gh b{font-weight:600;font-size:14.5px;line-height:1.25}
.gcard .gh .pill{margin-left:auto}
.gcard .gv{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gcard .gv .serif{font-size:22px;color:var(--hero)}
.gcard .note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line2);padding-top:10px}

/* insights / recs */
.ins{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.ins li{position:relative;padding-left:18px;font-size:13.5px;color:var(--ink2)}
.ins li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.ins b{color:var(--ink)}
.recs{display:grid;gap:2px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.rec:last-child{border-bottom:0}
.rec .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:13px}
.rec .n.bad{background:var(--neg-bg);color:var(--neg)}.rec .n.warn{background:var(--gold-bg);color:var(--gold-ink)}.rec .n.good{background:var(--pos-bg);color:var(--pos)}
.rec h4{font-size:14.5px;font-weight:600;margin-bottom:3px}
.rec p{font-size:13.5px;color:var(--muted)}
.wins{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.wins li{display:flex;gap:10px;font-size:14px}
.wins li .ck{width:20px;height:20px;border-radius:50%;background:var(--pos-bg);color:var(--pos);display:grid;place-items:center;flex:none;margin-top:1px}

/* plan */
.plan{display:grid}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 116px;gap:18px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:0}
.prow .pl b{font-weight:600}
.prow .pl span{display:block;font-size:12.5px;color:var(--muted)}
.prow .pt{display:grid;gap:5px;font-size:13px}
.ptrack{position:relative;height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.ptrack i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.ptrack .need{background:repeating-linear-gradient(-45deg,var(--gold) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1px var(--gold-line)}
.ptrack .fund{background:var(--c2)}
.prow .pill{justify-self:end}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tl{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;align-content:start;background:var(--surface)}
.tl h4{font-family:var(--f-serif);font-size:19px;font-weight:500}
.tl ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:13.5px;color:var(--ink2)}

/* segmented & tabs */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:500;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.dark button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--gold) 0 var(--p,50%),var(--ink2) var(--p,50%) 100%);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--gold)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--gold)}

/* ---------- forms (checkup) ---------- */
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:thin}
.stepper button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px 6px 6px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.stepper button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--muted)}
.stepper button.done .n{background:var(--pos-bg);color:var(--pos)}
.stepper button.on{border-color:var(--primary);color:var(--ink);font-weight:600}
.stepper button.on .n{background:var(--primary);color:var(--primary-ink)}
.ck{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.panel-head{display:grid;gap:6px}
.panel-head h2{font-family:var(--f-serif);font-size:28px;font-weight:500;letter-spacing:-.015em}
.panel-head p{color:var(--muted);max-width:44em}
.sub{display:grid;gap:14px;padding-top:4px}
.sub h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>

/* ---------- Config ---------- */
const ADVISOR = (window.MM_CONFIG && window.MM_CONFIG.advisor) || { org: "DareToDreams Financial Group", phone: "870-543-0062" };
const RATE = 0.06;          // assumed annual growth for savings projections
const INFL = 0.03;          // general inflation
const EDU_INFL = 0.05;      // college cost inflation

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const $f = n => usd.format(Math.round(n||0));
const $k = n => { n=Math.round(n||0); const a=Math.abs(n); if(a>=1e6) return (n<0?"-":"")+"$"+(a/1e6).toFixed(a>=1e7?1:2).replace(/\.0+$/,"")+"M"; if(a>=1e4) return (n<0?"-":"")+"$"+Math.round(a/1e3)+"K"; return $f(n); };
const pct = n => (isFinite(n)? Math.round(n*100) : 0)+"%";
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const withTimeout = (p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
const fv = (pv,pmt,years,rate=RATE)=>{ const n=Math.max(0,Math.round(years*12)), r=rate/12; if(n===0) return pv; const g=Math.pow(1+r,n); return pv*g + pmt*((g-1)/r); };
const annuityFactor = (years,rate=RATE)=>{ const n=Math.max(0,Math.round(years*12)), r=rate/12; return n? (Math.pow(1+r,n)-1)/r : 0; };

/* ---------- State ---------- */
function blank(){
  return {
    profile:{ name:"", age:"", marital:"married", spouseName:"", spouseAge:"", state:"", kids:[], occupation:"" },
    income:{ primary:0, spouse:0, other:0, takeHome:0 },
    expenses:{ housing:0, utilities:0, food:0, transport:0, insurance:0, childcare:0, debt:0, phone:0, family:0, fun:0, other:0 },
    flow:{ saving:0, investing:0 },
    dime:{ cc:0, auto:0, student:0, otherDebt:0, finalExp:15000, years:10, mortgage:0, eduPerChild:100000, spouseValue:0 },
    assets:{ cash:0, investments:0, retirement:0, other:0, homeValue:0, includeRetirement:false },
    insurance:{ has:"yes", policies:[], disability:false, health:true, ltc:false },
    college:{ costPerYear:25000, years:4, kids:[] },
    retirement:{ accounts:[], monthly:0, matchPct:0, retireAge:65, desiredMonthly:0, ssMonthly:0 },
    estate:{ will:false, trust:false, poa:false, healthcare:false, beneficiaries:false, guardian:false },
    goals:{ priorities:[], horizon:"1 year", monthlyBudget:0, notes:"" }
  };
}
function sample(){
  const S=blank();
  Object.assign(S.profile,{name:"Ryan Mitchell (Example)",age:45,marital:"married",spouseName:"Priya",spouseAge:42,state:"AL",occupation:"Realtor",kids:[{name:"Ethan",age:6},{name:"Maya",age:4}]});
  Object.assign(S.income,{primary:100000,spouse:100000,other:0,takeHome:12400});
  Object.assign(S.expenses,{housing:2400,utilities:420,food:1300,transport:950,insurance:520,childcare:1100,debt:650,phone:250,family:300,fun:600,other:400});
  Object.assign(S.flow,{saving:600,investing:300});
  Object.assign(S.dime,{cc:8500,auto:26000,student:18000,otherDebt:0,finalExp:15000,years:12,mortgage:285000,eduPerChild:100000});
  Object.assign(S.assets,{cash:18000,investments:25000,retirement:165000,other:0,homeValue:420000});
  S.insurance.policies=[{owner:"primary",type:"Term",face:500000,premium:45,yearsLeft:8},{owner:"spouse",type:"Group/employer",face:100000,premium:0,yearsLeft:0}];
  Object.assign(S.insurance,{has:"yes",disability:false,health:true,ltc:false});
  S.college.kids=[{type:"529 plan",balance:12000,monthly:150},{type:"None yet",balance:0,monthly:0}];
  Object.assign(S.retirement,{accounts:["SEP / Solo 401(k)","403(b)","Roth IRA"],monthly:900,matchPct:0,retireAge:65,desiredMonthly:9000,ssMonthly:4800});
  Object.assign(S.estate,{will:true,trust:false,poa:false,healthcare:false,beneficiaries:true,guardian:false});
  Object.assign(S.goals,{priorities:["Protect my family","Kids' college","Retire comfortably"],horizon:"2–3 years",monthlyBudget:1500});
  return S;
}
function merge(base,o){ if(!o||typeof o!=="object") return base; for(const k in base){ if(o[k]===undefined) continue; if(Array.isArray(base[k])) base[k]=Array.isArray(o[k])?o[k]:base[k]; else if(base[k]&&typeof base[k]==="object") merge(base[k],o[k]); else base[k]=o[k]; } return base; }

let S = blank();
let step = 0;
let view = "auth";
let history = [];
let account = { mode:null, name:"", ref:null, hist:null, localKey:null };
let maxStep = 0;

/* ---------- Calculations ---------- */
function calc(){
  const p=S.profile, inc=S.income, ex=S.expenses, d=S.dime, a=S.assets;
  const married = p.marital==="married" || p.marital==="partner";
  const kids = p.kids||[];
  const age = +p.age||40;
  const grossAnnual = (+inc.primary||0)+(married?(+inc.spouse||0):0)+(+inc.other||0);
  const grossMonthly = grossAnnual/12;
  const takeHome = (+inc.takeHome>0)? +inc.takeHome : grossMonthly*0.78;
  const expenses = sum(Object.values(ex));
  const saveInvest = (+S.flow.saving||0)+(+S.flow.investing||0);
  const surplus = takeHome-expenses-saveInvest;
  const retMonthly = +S.retirement.monthly||0;
  const savingsRate = grossMonthly? (saveInvest+retMonthly)/grossMonthly : 0;
  const dti = grossMonthly? ((+ex.housing||0)+(+ex.debt||0))/grossMonthly : 0;
  const emMonths = expenses? (+a.cash||0)/expenses : 0;

  // DIME
  const D = (+d.cc||0)+(+d.auto||0)+(+d.student||0)+(+d.otherDebt||0)+(+d.finalExp||0);
  const M = +d.mortgage||0;
  const E = (+d.eduPerChild||0)*kids.length;
  const yrs = +d.years||10;
  const Ip = (+inc.primary||0)*yrs;
  const Is = married? Math.max(+inc.spouse||0, +d.spouseValue||0)*yrs : 0;
  const liquid = (+a.cash||0)+(+a.investments||0)+(+a.other||0)+(a.includeRetirement?(+a.retirement||0):0);
  const pols = S.insurance.has==="yes"? (S.insurance.policies||[]) : [];
  const coverP = sum(pols.filter(x=>x.owner!=="spouse").map(x=>x.face));
  const coverS = sum(pols.filter(x=>x.owner==="spouse").map(x=>x.face));
  const needP = D+Ip+M+E, needS = married? D+Is+M+E : 0;
  const gapP = Math.max(0,needP-liquid-coverP);
  const gapS = married? Math.max(0,needS-liquid-coverS) : 0;
  const people = [{who:p.name?firstName(p.name):"You",role:"primary",age, D,I:Ip,M,E,need:needP,liquid,cover:coverP,gap:gapP}];
  if(married) people.push({who:p.spouseName||"Spouse",role:"spouse",age:+p.spouseAge||age,D,I:Is,M,E,need:needS,liquid,cover:coverS,gap:gapS});
  const totalNeed = sum(people.map(x=>x.need));
  const protScore = totalNeed? clamp(sum(people.map(x=>Math.min(x.need,x.liquid+x.cover)))/totalNeed) : 1;
  const groupOnly = pols.filter(x=>x.type==="Group/employer").length>0;
  const shortTerm = pols.filter(x=>x.type==="Term" && kids.length && (+x.yearsLeft||0) < (18-Math.min(...kids.map(k=>+k.age||0)))).length>0;

  // College
  const ckids = kids.map((k,i)=>{
    const c = S.college.kids[i]||{type:"None yet",balance:0,monthly:0};
    const yTo = Math.max(0,18-(+k.age||0));
    const target = (+S.college.costPerYear||0)*(+S.college.years||4)*Math.pow(1+EDU_INFL,yTo);
    const proj = fv(+c.balance||0,+c.monthly||0,yTo);
    const gap = Math.max(0,target-proj);
    const need = yTo>0? gap/annuityFactor(yTo) : gap;
    return { name:k.name||("Child "+(i+1)), age:+k.age||0, yTo, target, proj, gap, monthlyNeed:need, type:c.type, balance:+c.balance||0, monthly:+c.monthly||0 };
  });
  const eduTarget=sum(ckids.map(x=>x.target)), eduProj=sum(ckids.map(x=>Math.min(x.proj,x.target)));

  // Retirement
  const r=S.retirement;
  const yRet = Math.max(0,(+r.retireAge||65)-age);
  const match = (+r.matchPct||0)/100*(+inc.primary||0)/12;
  const retProj = fv(+a.retirement||0, retMonthly+match, yRet);
  const desired = (+r.desiredMonthly>0)? +r.desiredMonthly : takeHome*0.8;
  const netMonthlyNeed = Math.max(0, desired-(+r.ssMonthly||0));
  const retTarget = netMonthlyNeed*12*25*Math.pow(1+INFL,yRet);
  const retGap = Math.max(0,retTarget-retProj);
  const retExtra = yRet>0? retGap/annuityFactor(yRet) : retGap;
  const retSeries=[]; for(let y=0;y<=yRet;y++) retSeries.push({age:age+y, v:fv(+a.retirement||0, retMonthly+match, y)});

  // Estate
  const estItems = [["will","Will"],["trust","Living trust"],["poa","Financial power of attorney"],["healthcare","Healthcare directive"],["beneficiaries","Beneficiaries up to date"]];
  if(kids.length) estItems.push(["guardian","Guardian named for kids"]);
  const estDone = estItems.filter(([k])=>S.estate[k]).length;

  // Scores
  const sc = {
    cash: grossMonthly? (surplus<0? Math.min(30,clamp(savingsRate/0.2)*100) : clamp(savingsRate/0.2)*100) : 0,
    emergency: clamp(emMonths/6)*100,
    debt: grossMonthly? clamp((0.5-dti)/(0.5-0.28))*100 : 0,
    protection: protScore*100,
    education: kids.length? (eduTarget? clamp(eduProj/eduTarget)*100 : 100) : null,
    retirement: retTarget? clamp(retProj/retTarget)*100 : 100,
    estate: estDone/estItems.length*100
  };
  const W={cash:15,emergency:15,debt:10,protection:25,education:10,retirement:20,estate:5};
  let ws=0,tot=0; for(const k in W){ if(sc[k]==null) continue; ws+=W[k]; tot+=W[k]*sc[k]; }
  const score = Math.round(tot/ws);

  // Action plan
  const H = {"6 months":6,"1 year":12,"2–3 years":30,"5+ years":60}[S.goals.horizon]||12;
  const actions=[];
  const efTarget=6*expenses;
  if(+a.cash < efTarget && expenses) actions.push({key:"ef",title:"Build emergency fund to 6 months",amt:(efTarget-(+a.cash||0))/Math.max(6,Math.min(24,H)),why:`You have ${emMonths.toFixed(1)} months saved; goal is ${$f(efTarget)}.`});
  people.forEach(x=>{ if(x.gap>0) actions.push({key:"life-"+x.role,title:`Life insurance for ${x.who}`,amt:termEstimate(x.gap,x.age),why:`Coverage gap of ${$k(x.gap)}. Estimated 20-year term premium (illustrative).`,est:true}); });
  if((+inc.primary||0)>0 && !S.insurance.disability) actions.push({key:"di",title:"Disability income protection",amt:grossAnnual*0.015/12,why:"Protects your paycheck if illness or injury stops you working. Rough estimate.",est:true});
  if(+d.cc>0) actions.push({key:"cc",title:"Pay off credit cards",amt:(+d.cc)/Math.min(24,Math.max(6,H)),why:`${$f(d.cc)} at high interest. Extra payment above minimums.`});
  if(retExtra>0) actions.push({key:"ret",title:"Increase retirement savings",amt:retExtra,why:`Projected shortfall of ${$k(retGap)} at age ${r.retireAge}.`});
  const eduNeed=sum(ckids.map(x=>x.monthlyNeed));
  if(eduNeed>0) actions.push({key:"edu",title:"Fund college savings",amt:eduNeed,why:`Gap of ${$k(sum(ckids.map(x=>x.gap)))} across ${ckids.length} ${ckids.length>1?"children":"child"}.`});
  // priority ordering by stated goals
  const order = ["ef","life-primary","life-spouse","di","cc","ret","edu"];
  const pr=S.goals.priorities||[];
  const boost = k => (pr.includes("Protect my family")&&k.startsWith("life")?-3:0)+(pr.includes("Pay off debt")&&k==="cc"?-2:0)+(pr.includes("Retire comfortably")&&k==="ret"?-2:0)+(pr.includes("Kids' college")&&k==="edu"?-2:0)+(pr.includes("Emergency savings")&&k==="ef"?-2:0);
  actions.sort((x,y)=>(order.indexOf(x.key)+boost(x.key))-(order.indexOf(y.key)+boost(y.key)));
  const budget = (+S.goals.monthlyBudget>0)? +S.goals.monthlyBudget : Math.max(0,surplus);
  let left=budget; actions.forEach(x=>{ x.funded=Math.min(x.amt,Math.max(0,left)); left-=x.funded; });
  const needTotal=sum(actions.map(x=>x.amt)), fundedTotal=sum(actions.map(x=>x.funded));

  return {married,kids,age,grossAnnual,grossMonthly,takeHome,expenses,saveInvest,surplus,savingsRate,dti,emMonths,
    D,M,E,yrs,liquid,people,totalNeed,protScore,groupOnly,shortTerm,ckids,eduTarget,eduProj,
    yRet,match,retProj,retTarget,retGap,retExtra,retSeries,desired,estItems,estDone,sc,score,actions,budget,needTotal,fundedTotal,H,efTarget};
}
function termEstimate(gap,age){ const rate = age<30?0.035: age<40?0.05: age<50?0.11: age<60?0.28: 0.75; return gap/1000*rate; }
function firstName(n){ return String(n).replace(/\(.*\)/,"").trim().split(/\s+/)[0]||"You"; }
function status(v){ if(v==null) return ["na","Not applicable"]; if(v>=80) return ["good","Strong"]; if(v>=50) return ["warn","Needs attention"]; return ["bad","Priority"]; }
function grade(s){ if(s>=85) return "Excellent"; if(s>=70) return "Good"; if(s>=50) return "Fair"; return "Needs work"; }

/* ---------- Path helpers ---------- */
function getP(path){ return path.split(".").reduce((o,k)=>o?.[k],S); }
function setP(path,val){ const ks=path.split("."); let o=S; for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]; } o[ks.at(-1)]=val; }

function num(path,label,suf="",hint=""){ const v=getP(path); return `<label class="field" for="${fid(path)}"><span class="lbl">${label}</span><div class="inwrap"><input class="n" id="${fid(path)}" type="text" inputmode="decimal" data-path="${path}" data-kind="num" value="${v!==""&&v!=null&&v!==0?esc(v):""}" placeholder="0">${suf?`<span class="suf">${suf}</span>`:""}</div>${hint?`<span class="hint">${hint}</span>`:""}</label>`; }
function text(path,label,ph=""){ return `<label class="field" for="${fid(path)}"><span class="lbl">${label}</span><div class="inwrap"><input id="${fid(path)}" type="text" data-path="${path}" value="${esc(getP(path))}" placeholder="${esc(ph)}"></div></label>`; }
function select(path,label,opts,rerender=false){ const v=getP(path); return `<label class="field" for="${fid(path)}"><span class="lbl">${label}</span><div class="inwrap"><select id="${fid(path)}" data-path="${path}" ${rerender?"data-rerender":""}>${opts.map(o=>{const [val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(t)}</option>`}).join("")}</select></div></label>`; }
function toggle(path,title,sub="",rerender=false){ return `<label class="toggle" for="${fid(path)}"><input type="checkbox" id="${fid(path)}" data-path="${path}" data-kind="bool" ${getP(path)?"checked":""} ${rerender?"data-rerender":""}><span><span class="t">${title}</span>${sub?`<br><span class="s">${sub}</span>`:""}</span></label>`; }
function chips(path,opts){ const v=getP(path)||[]; return `<div class="chips">${opts.map(o=>`<button type="button" class="chip" data-chip="${path}" data-val="${esc(o)}" aria-pressed="${v.includes(o)}">${esc(o)}</button>`).join("")}</div>`; }

        ${select(`insurance.policies.${j}.type`,"Type",["Term","Whole life","IUL","Universal life","Group/employer"])}

function head(t,d){ return `<div class="panel-head"><span class="eyebrow">Step ${step+1} of ${STEPS.length} · ${STEPS[step].phase}</span><h2>${t}</h2><p>${d}</p></div>`; }

function estateHint(k){ return {will:"Directs who receives your assets.",trust:"Avoids probate and controls timing of gifts.",poa:"Someone you trust handles finances if you can't.",healthcare:"Your medical wishes in writing.",beneficiaries:"On life insurance and retirement accounts.",guardian:"Who raises your children."}[k]; }

function snapshotCallout(c){

}
function dimeCallout(c){ return `<div class="callout"><span>Σ</span><span><b>DIME total:</b> ${c.people.map(x=>`${esc(x.who)} <b class="num">${$f(x.need)}</b>`).join(" · ")}. Next, we'll subtract what you already own.</span></div>`; }
function assetCallout(c){ return `<div class="callout"><span>−</span><span><b>Assets that offset your need:</b> <b class="num">${$f(c.liquid)}</b>. ${c.people.map(x=>`${esc(x.who)}'s remaining need before insurance: <b class="num">${$f(Math.max(0,x.need-x.liquid))}</b>`).join(" · ")}.</span></div>`; }

function recs(c){
  const R=[];
  if(c.surplus<0) R.push(["bad","Fix monthly cash flow first",`You're short ${$f(-c.surplus)} a month. Trim the two largest flexible categories (dining, entertainment, subscriptions) and pause new spending on credit.`]);
  c.people.forEach(x=>{ if(x.gap>0) R.push(["bad",`Close ${x.who}'s ${$k(x.gap)} life insurance gap`,`If ${x.who}'s income stopped, your family would be short ${$f(x.gap)}. A ${x.age<50?"20- or 30-year term":"term or guaranteed"} policy is usually the most affordable way to cover it; estimated ~${$f(termEstimate(x.gap,x.age))}/month for a healthy non-smoker.`]); });
  if(c.groupOnly) R.push(["warn","Don't rely on employer life insurance alone","Group coverage usually ends when you leave or lose the job, and is often only 1–2× salary. Own a policy that goes where you go."]);
  if(c.shortTerm) R.push(["warn","A term policy ends before your kids are grown","Consider a longer term or adding coverage so protection lasts until your youngest is independent."]);
  if(c.emMonths<3) R.push(["bad","Build a starter emergency fund",`Aim for 3 months (${$f(3*c.expenses)}) first, then 6. Keep it in a high-yield savings account separate from checking.`]);
  else if(c.emMonths<6) R.push(["warn","Grow your emergency fund to 6 months",`You have ${c.emMonths.toFixed(1)} months. Target ${$f(c.efTarget)}.`]);
  if(+S.dime.cc>0) R.push(["warn","Eliminate credit card balances",`${$f(S.dime.cc)} in card debt likely costs 20%+ a year. Pay the highest rate first (avalanche) or smallest balance first (snowball) while paying minimums on the rest.`]);
  if(c.dti>0.36) R.push(["warn","Lower your debt-to-income ratio",`Housing and debt take ${pct(c.dti)} of gross income; lenders like 36% or less.`]);
  if(!S.insurance.disability && c.grossAnnual>0) R.push(["warn","Protect your paycheck with disability coverage","You're more likely to miss work from illness or injury than to die young. Disability insurance typically replaces 60% of income."]);
  if(c.match>0 && +S.retirement.monthly < c.match) R.push(["warn","Capture your full employer match","Contribute at least enough to get the full match. It's an instant 50–100% return."]);
  if(c.retGap>0) R.push([c.sc.retirement<50?"bad":"warn","Increase retirement contributions",`Add about ${$f(c.retExtra)}/month, or raise contributions 1% each year. ${c.yRet<12?"With fewer than 12 years to go, consider catch-up contributions.":"Time is on your side, so small increases now grow a lot."}`]);
  c.ckids.forEach(k=>{ if(k.gap>0) R.push(["warn",`College fund for ${k.name}`,`Projected ${$k(k.proj)} vs ${$k(k.target)} needed in ${k.yTo} years. ${k.type==="None yet"?"Open a 529 plan; many states, including Alabama, offer a state tax deduction.":`Add about ${$f(k.monthlyNeed)}/month to the ${k.type}.`}`]); });
  const missing=c.estItems.filter(([k])=>!S.estate[k]).map(([,t])=>t.toLowerCase());
  if(missing.length) R.push([missing.length>3?"bad":"warn","Complete your estate documents",`Still needed: ${missing.join(", ")}.${c.kids.length&&!S.estate.guardian?" Naming a guardian is the most important step for parents.":""}`]);
  return R;
}
function wins(c){
  const W=[];
  if(c.surplus>0) W.push(`You spend less than you earn, with ${$f(c.surplus)} free each month.`);
  if(c.savingsRate>=0.1) W.push(`You save ${pct(c.savingsRate)} of your income.`);
  if(c.emMonths>=3) W.push(`You have ${c.emMonths.toFixed(1)} months of expenses in savings.`);
  if(c.people.some(x=>x.cover>0)) W.push("You already own life insurance, a strong foundation to build on.");
  if(+S.assets.retirement>0) W.push(`You've built ${$f(S.assets.retirement)} for retirement.`);
  if(c.ckids.some(k=>k.balance>0||k.monthly>0)) W.push("You've started saving for your children's education.");
  if(S.estate.will) W.push("You have a will in place.");
  if(c.dti<=0.28 && c.grossAnnual) W.push("Your debt load is in a healthy range.");
  if(!W.length) W.push("You took the most important step: you now know exactly where you stand.");
  return W;
}
function timeline(c){
  const d30=[],d90=[],d12=[];
  if(c.surplus<0) d30.push("Cut monthly spending to get back to break-even");
  c.actions.forEach(a=>{
    if(a.key.startsWith("life")) d30.push(`Get life insurance quotes: ${a.title.replace("Life insurance for ","")}`);
    if(a.key==="di") d90.push("Add disability income coverage");
    if(a.key==="ef") d30.push(`Set up an automatic ${$f(a.funded||a.amt)}/month transfer to savings`);
    if(a.key==="cc") d90.push(`Pay an extra ${$f(a.funded||a.amt)}/month on credit cards`);
    if(a.key==="ret") d90.push("Raise retirement contributions"+(c.match>0?" to at least the full match":""));
    if(a.key==="edu") d12.push("Open or increase 529 contributions for each child");
  });
  if(!S.estate.will || (c.kids.length&&!S.estate.guardian)) d30.push("Book an estate attorney; name a guardian");
  if(!S.estate.beneficiaries) d30.push("Review beneficiaries on all policies & accounts");
  if(!S.estate.poa||!S.estate.healthcare) d90.push("Sign power of attorney & healthcare directive");
  d12.push("Re-run your MoneyManager checkup and compare your score");
  if(c.emMonths<6) d12.push("Reach a full 6-month emergency fund");
  if(!d90.length) d90.push("Review budget and automate any new savings");
  return [d30,d90,d12];
}

function demoClient(){
  const K="mm-demo:"; const get=(k,d)=>{ try{ return JSON.parse(localStorage.getItem(K+k))??d; }catch(e){ return d; } }; const put=(k,v)=>{ try{ localStorage.setItem(K+k,JSON.stringify(v)); }catch(e){} };
  const users=()=>get("users",{}), saveUsers=u=>put("users",u);
  const newCode=email=>{ const c=String(Math.floor(100000+Math.random()*900000)); const codes=get("codes",{}); codes[email]={c,at:Date.now()}; put("codes",codes); window.__demoCode=c; return c; };
  const checkCode=(email,t)=>{ const x=get("codes",{})[email]; return x && x.c===t && Date.now()-x.at<3600e3; };
  const sess=()=>get("session",null), mk=u=>({user:{id:u.id,email:u.email,user_metadata:{full_name:u.name}}});
  const auth={
    async getSession(){ return {data:{session:sess()}}; }, onAuthStateChange(){},
    async signUp({email,password,options}){ const u=users(); if(u[email]?.confirmed) return {data:{user:{identities:[]}},error:null}; u[email]={id:"demo-"+Math.random().toString(36).slice(2,10),email,password,name:options?.data?.full_name||"",confirmed:false}; saveUsers(u); newCode(email); return {data:{user:{identities:[{}]},session:null},error:null}; },
    async resend({email}){ newCode(email); return {error:null}; },
    async verifyOtp({email,token,type,password}){ const u=users(); if(!u[email]||!checkCode(email,token)) return {data:{},error:{message:"Token has expired or is invalid"}}; u[email].confirmed=true; if(type==="recovery"&&password) u[email].password=password; saveUsers(u); const s=mk(u[email]); put("session",s); return {data:{session:s},error:null}; },
    async signInWithPassword({email,password}){ const x=users()[email]; if(!x||x.password!==password) return {data:{},error:{message:"Invalid login credentials"}}; if(!x.confirmed) return {data:{},error:{message:"Email not confirmed"}}; const s=mk(x); put("session",s); return {data:{session:s},error:null}; },
    async resetPasswordForEmail(email){ if(users()[email]) newCode(email); else window.__demoCode=null; return {error:null}; },
    async updateUser({password}){ const u=users(), s=sess(); const e=s&&Object.keys(u).find(k=>u[k].id===s.user.id); if(e){ u[e].password=password; saveUsers(u); } return {error:null}; },
    async signOut(){ put("session",null); return {error:null}; }
  };
  function from(t){ let f=null, ins=null; const rows=()=>get("t:"+t,[]);
    const api={ upsert(r){ const a=rows(); const i=a.findIndex(x=>x.user_id===r.user_id); i>=0?a[i]=r:a.push(r); put("t:"+t,a); return Promise.resolve({error:null}); },
      insert(r){ ins={...r,at:new Date().toISOString()}; const a=rows(); a.push(ins); put("t:"+t,a); return api; },
      select(){ return api; }, eq(k,v){ f=[k,v]; return api; }, order(){ return api; }, limit(){ return api; },
      maybeSingle(){ return Promise.resolve({data:rows().find(x=>x[f[0]]===f[1])||null,error:null}); },
      single(){ return Promise.resolve({data:ins,error:null}); },
      then(res,rej){ return Promise.resolve({data:rows().filter(x=>!f||x[f[0]]===f[1]).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,8),error:null}).then(res,rej); } };
    return api; }
  return {auth,from};
}

      const email=v("a-email").toLowerCase(); if(!EMAIL_RE.test(email)) return setMsg("err","Enter a valid email address.");
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(error) return setMsg("err",friendly(error));
      authEmail=email; authFlow="recovery"; resendAt=Date.now()+60000; return goAuth("reset");
    }
    if(form==="reset"){
      const token=otpValue(), p1=$("#a-pass").value, p2=$("#a-pass2").value;
      if(!/^\d{6}$/.test(token)) return setMsg("err","Enter all 6 digits of the code.");
      if(p1.length<8) return setMsg("err","Your new password needs at least 8 characters.");
      if(p1!==p2) return setMsg("err","The two passwords don't match.");
      const {data,error}=await sb.auth.verifyOtp({email:authEmail,token,type:"recovery",password:p1});
      if(error) return setMsg("err",friendly(error));
      if(!DEMO){ const up=await sb.auth.updateUser({password:p1}); if(up.error) return setMsg("err",friendly(up.error)); }
      toast("Password updated"); return onSignedIn(data.session);
    }
  } catch(e){ setMsg("err",friendly(e)); }
  finally{ busy(false); }
}
async function resendCode(){
  if(Date.now()<resendAt) return;
  try{
    const {error}= authFlow==="recovery"? await sb.auth.resetPasswordForEmail(authEmail,{redirectTo:location.origin+location.pathname}) : await sb.auth.resend({type:"signup",email:authEmail});
    if(error) return setMsg("err",friendly(error));
    resendAt=Date.now()+60000; if(DEMO){ render(); startResendTimer(); } else startResendTimer(); setMsg("ok","A new code is on its way.");
  }catch(e){ setMsg("err",friendly(e)); }
}
async function onSignedIn(session){
  if(!session?.user) return;
  const u=session.user;
  account={mode:"cloud",uid:u.id,email:u.email||"",name:(u.user_metadata&&u.user_metadata.full_name)||"",dl:account.dl};
  await loadData(); view="dashboard"; render();
}
async function signOut(){
  try{ await sb.auth.signOut(); }catch(e){}

/* ---------- Persistence (Supabase tables; row-level security returns only the user's own rows) ---------- */
let saveTimer=null, saving=false, again=false;
function payload(){ return { state: JSON.stringify(S), step, maxStep, updatedAt: new Date().toISOString(), score: calc().score }; }
function chip(cls,txt){ const el=$("#saveChip"); if(!el) return; el.className="sync "+cls; el.querySelector("span").textContent=txt; }
function scheduleSave(){ if(account.mode!=="cloud") return; clearTimeout(saveTimer); chip("busy","Saving…"); saveTimer=setTimeout(doSave,900); }
async function doSave(){
  if(account.mode!=="cloud") return;
  if(saving){ again=true; return; }
  saving=true;
  try{
    const p=payload();
    const c=calc(), nw=netWorth();
    const summary={name:S.profile.name||account.name, household_income:c.grossAnnual, monthly_surplus:c.surplus, net_worth:nw.net, protection_gap:sum(c.people.map(x=>x.gap)), retirement_gap:c.retGap, checkup_step:maxStep>=STEPS.length-1?"Complete":`Step ${maxStep+1} of ${STEPS.length}`};
    const {error}=await sb.from("plans").upsert({user_id:account.uid,state:S,step:p.step,max_step:p.maxStep,score:p.score,updated_at:p.updatedAt,...summary,household_income:Math.round(summary.household_income),monthly_surplus:Math.round(summary.monthly_surplus),net_worth:Math.round(summary.net_worth),protection_gap:Math.round(summary.protection_gap),retirement_gap:Math.round(summary.retirement_gap)});
    if(error) throw error;
    chip("",DEMO?"Saved in this browser":"Saved to your account");
  }catch(e){ chip("err","Couldn't save. Check your connection"); }
  saving=false; if(again){ again=false; doSave(); }
}
async function loadData(){
  S=blank(); step=0; maxStep=0; history=[];
  try{
    const {data,error}=await sb.from("plans").select("state,step,max_step").eq("user_id",account.uid).maybeSingle();
    if(error) throw error;
    if(data){ S=merge(blank(),data.state||{}); step=+data.step||0; maxStep=+data.max_step||0; }
    else if(account.name){ S.profile.name=account.name; }
    const hs=await sb.from("checkups").select("at,score,grade").eq("user_id",account.uid).order("at",{ascending:false}).limit(8);
    history=hs.data||[];
  }catch(e){ toast("Couldn't load your saved plan. Check your connection and reload."); }
}
async function saveHistory(){
  const c=calc();
  try{
    const row={user_id:account.uid,score:c.score,grade:grade(c.score),protection_gap:Math.round(sum(c.people.map(x=>x.gap))),retirement_gap:Math.round(c.retGap)};
    const {data,error}=await sb.from("checkups").insert(row).select("at,score,grade").single();
    if(error) throw error;
    history=[data,...history].slice(0,8);
    toast("Checkup saved to your history"); if(view!=="checkup") render(true);
  }catch(e){ toast("Couldn't save to history. Try again."); }
}

function confirmBox(title,body,okText,fn){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-danger" data-ok>${esc(okText)}</button></div></div>`;

}

  return `<div class="donut" style="width:${size}px;height:${size}px;margin:0 auto"><svg viewBox="0 0 100 100" role="img" aria-label="${esc(sub)}"><g transform="rotate(-90 50 50)"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="20"/>${arcs}</g></svg><div class="dc"><b class="num">${center}</b><span>${sub}</span></div></div>`; }

function retChart(c){

    <text x="${x(s.length-1)-8}" y="${y(c.retProj)+(c.retProj>c.retTarget*.85?18:-10)}" text-anchor="end" style="fill:var(--ink);font-weight:600">Projected ${$k(c.retProj)}</text>
    <text x="${L}" y="${H-8}">Age ${s[0].age} · today</text><text x="${W-R}" y="${H-8}" text-anchor="end">Age ${s.at(-1).age}</text></svg></div>`; }
function planChart(c,list=c.actions){ if(!list.length) return `<p class="muted">No gaps to fund. Keep investing your surplus.</p>`;
  const mx=Math.max(...list.map(a=>a.amt),1);
  return `<div class="plan">${list.map((a,i)=>{ const st=a.funded>=a.amt-1?["good","Funded"]:a.funded>0?["warn","Partly funded"]:["bad","Next phase"];
    return `<div class="prow"><div class="pl"><b>${i+1}. ${esc(a.title)}</b><span>${esc(a.why)}</span></div>
      <div class="pt"><div class="ptrack"><i class="need" style="width:${a.amt/mx*100}%"></i><i class="fund" style="width:${a.funded/mx*100}%"></i></div><span class="num"><b>${$f(a.funded)}</b> <span class="muted">of ${$f(a.amt)}/mo${a.est?"*":""}</span></span></div>
      ${pill(st[0],st[1])}</div>`; }).join("")}</div>
    <div class="legend"><span><i style="background:var(--c2)"></i>Funded from your monthly budget</span><span><i class="hatch" style="background:none"></i>Still needed</span></div>`; }
function trendChart(c){
  const pts=[...history].reverse().map(h=>({d:new Date(h.at),v:+h.score||0}));
  if(!pts.length || Math.abs((pts.at(-1)?.d||0)-Date.now())>6e4) pts.push({d:new Date(),v:c.score,now:true});
  if(pts.length<2) return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${ringSVG(c.score,120)}<div style="display:grid;gap:10px;flex:1;min-width:180px"><p class="muted" style="font-size:13.5px">Save each checkup to track how your score improves over time.</p><div><button class="btn btn-ghost btn-sm" data-act="savehist">${icon("save",15)} Save today's checkup</button></div></div></div>`;
  const W=420,H=190,L=30,R=12,T=14,B=26, x=i=>L+(W-L-R)*i/(pts.length-1), y=v=>T+(H-T-B)*(1-v/100);
  const path=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Health score over time">
    ${[0,50,100].map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("")}
    <path d="${path}L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--c2)" fill-opacity=".1"/><path d="${path}" fill="none" stroke="var(--c2)" stroke-width="2.4"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?"var(--c1)":"var(--surface)"}" stroke="var(--c2)" stroke-width="2"><title>${p.d.toLocaleDateString()} · ${p.v}</title></circle>`).join("")}
    <text x="${L}" y="${H-6}">${pts[0].d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</text><text x="${W-R}" y="${H-6}" text-anchor="end">Today · ${pts.at(-1).v}</text></svg>`; }
function timelineHTML(c){ const [d30,d90,d12]=timeline(c); return `<div class="timeline">
  <div class="tl"><span class="eyebrow">First 30 days</span><h4>Protect & organize</h4><ul>${d30.map(x=>`<li>${esc(x)}</li>`).join("")||"<li>Review this report</li>"}</ul></div>
  <div class="tl"><span class="eyebrow">Within 90 days</span><h4>Build momentum</h4><ul>${d90.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div class="tl"><span class="eyebrow">Within 12 months</span><h4>Grow & review</h4><ul>${d12.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`; }
function kcard(label,ic,val,foot,cls=""){ return `<div class="kcard ${cls.includes("neg-tint")?"neg-tint":""}"><div class="kh"><span>${label}</span>${icon(ic,16)}</div><div class="kv num ${cls.replace("neg-tint","")}">${val}</div><div class="kf">${foot}</div></div>`; }
function goalCards(c){
  const G=[];
  G.push({ic:"umbrella",t:"Emergency fund",cur:+S.assets.cash||0,tgt:c.efTarget,note:c.emMonths>=6?"Fully funded. Keep it in high-yield savings.":`${c.emMonths.toFixed(1)} of 6 months saved.`});
  G.push({ic:"shield",t:"Family protection",cur:sum(c.people.map(x=>Math.min(x.need,x.liquid+x.cover))),tgt:c.totalNeed,note:`Gap ${$k(sum(c.people.map(x=>x.gap)))} across ${c.people.length} ${c.people.length>1?"earners":"earner"}.`});
  c.ckids.forEach(k=>G.push({ic:"cap",t:`College: ${k.name}`,cur:Math.min(k.proj,k.target),tgt:k.target,note:k.gap?`+${$f(k.monthlyNeed)}/mo closes it by ${new Date().getFullYear()+k.yTo}.`:"On track.",proj:true}));
  G.push({ic:"trend",t:`Retirement at ${S.retirement.retireAge}`,cur:Math.min(c.retProj,c.retTarget),tgt:c.retTarget,note:c.retGap?`+${$f(c.retExtra)}/mo closes the gap.`:"On track.",proj:true});
  G.push({ic:"scroll",t:"Estate documents",cur:c.estDone,tgt:c.estItems.length,cnt:true,note:`${c.estItems.length-c.estDone} documents still to do.`});
  return `<div class="goals">${G.map(g=>{ const r=g.tgt?clamp(g.cur/g.tgt):1, [t,l]=goalTone(r); return `<div class="gcard"><div class="gh"><span class="chip-ic gold">${icon(g.ic,16)}</span><b>${esc(g.t)}</b>${pill(t,l)}</div>
    <div class="gv"><span class="num"><b>${g.cnt?g.cur:$k(g.cur)}</b> <span class="muted">/ ${g.cnt?g.tgt:$k(g.tgt)}${g.proj?" projected":""}</span></span><span class="serif">${Math.round(r*100)}%</span></div>
    <div class="bar"><i class="${t}" style="width:${r*100}%"></i></div><div class="note">${esc(g.note)}</div></div>`; }).join("")}</div>`; }
function insights(c){ const L=[]; const gap=c.needTotal-c.fundedTotal;
  if(c.actions.length) L.push(`Your plan needs <b>${$f(c.needTotal)}</b>/month and your budget is <b>${$f(c.budget)}</b>${gap>1?`, a <span class="neg"><b>${$f(gap)}</b></span> monthly gap. The top priorities are funded first.`:". Every priority is funded."}`);
  if(c.surplus>c.budget+1) L.push(`You have <b>${$f(c.surplus-c.budget)}</b>/month of surplus not assigned to the plan. Moving it in would fund more priorities right away.`);
  if(c.surplus<0) L.push(`You're spending <span class="neg"><b>${$f(-c.surplus)}</b></span> more than you take home each month. Fixing cash flow comes first.`);
  L.push(`Family protection covers <b>${pct(c.protScore)}</b> of the DIME need. ${c.people.filter(x=>x.gap).map(x=>`${esc(x.who)}'s gap is <b>${$k(x.gap)}</b>`).join(" and ")||"No gaps."}`);
  if(c.retGap>0) L.push(`Retirement is <b>${pct(c.retProj/c.retTarget)}</b> on track. Adding about <b>${$f(c.retExtra)}</b>/month, or 1% more each year, closes it.`);
  if(c.emMonths<6) L.push(`Emergency savings cover <b>${c.emMonths.toFixed(1)} months</b> of expenses; 6 months is the goal.`);
  return `<ul class="ins">${L.slice(0,4).map(x=>`<li>${x}</li>`).join("")}</ul>`; }

        <tr class="total"><td>Total out</td><td class="r num">${$f(c.expenses+c.saveInvest)}</td><td class="r num">${$f((c.expenses+c.saveInvest)*12)}</td><td class="r num">${((c.expenses+c.saveInvest)/th*100).toFixed(1)}%</td><td colspan="2" class="${c.surplus>=0?"pos":"neg"}">${c.surplus>=0?$f(c.surplus)+" left each month":$f(-c.surplus)+" short each month"}</td></tr></tbody></table></div>`
      :`<div style="display:grid;gap:22px">${fifty.map(([l,d,v,t])=>{ const r=v/base, st=l==="Savings"?(r>=t?["good","On target"]:["warn","Below target"]):(r<=t?["good","Within target"]:["bad","Over target"]); return `<div class="hb"><div class="hb-l"><span><b>${l}</b> <span class="muted">· ${d}</span></span><span class="num"><b>${$f(v)}</b> · ${(r*100).toFixed(1)}% <span class="muted">(target ${t*100}%)</span></span></div>

    </section>
    <section class="card s4"><div class="ch"><h3>Spending by category</h3><span class="muted" style="font-size:12.5px">Monthly</span></div>${cashDonut(c)}</section>

      ${[["Savings rate",pct(c.savingsRate),"Goal 15–20% of gross",c.savingsRate>=.15?"good":"warn"],["Debt-to-income",pct(c.dti),"Housing + debt ÷ gross; under 36% is healthy",c.dti<=.36?"good":"bad"],["Emergency fund",c.emMonths.toFixed(1)+" months","Goal 6 months · "+$f(c.efTarget),toneScore(c.sc.emergency)],["Housing share",pct((+e.housing||0)/(c.grossMonthly||1)),"Under 28% of gross is healthy",((+e.housing||0)/(c.grossMonthly||1))<=.28?"good":"warn"]].map(([l,v,h,t])=>`<div class="hb" style="gap:6px"><span class="hint">${l}</span><span class="kv num" style="font-size:26px">${v}</span><span>${pill(t,h)}</span></div>`).join("")}</div></section>
  </div></div>`; }

function pageProtection(){
  if(!hasData()) return emptyState();
  const c=calc(), gapAll=sum(c.people.map(x=>x.gap)), covered=c.totalNeed-gapAll, pols=S.insurance.has==="yes"?S.insurance.policies:[];
  const nm=o=>o==="spouse"?(S.profile.spouseName||"Spouse"):firstName(S.profile.name);
  const flag=p=>p.type==="Group/employer"?pill("warn","Ends if you leave the job"):p.type==="Term"&&c.kids.length&&(+p.yearsLeft||0)<18-Math.min(...c.kids.map(k=>+k.age||0))?pill("warn","Ends before kids are grown"):pill("good","OK");
  return `<div style="display:grid;gap:22px">
  <div class="summary-line"><span>${c.people.length} insured ${c.people.length>1?"earners":"earner"} · <b>${$f(c.totalNeed)}</b> DIME need</span><span>Covered <b>${$f(covered)}</b> · Gap <b class="neg">${$f(gapAll)}</b></span></div>
  <section class="card"><div class="grid12" style="align-items:center">
    <div class="s7"><div class="feat">${ring(c.totalNeed?covered/c.totalNeed:1,190,"covered")}<div style="display:grid;gap:14px;min-width:0">
      <div style="display:flex;gap:10px;align-items:center"><span class="chip-ic gold">${icon("shield",16)}</span><h2>Family protection</h2></div>
      <div><span class="big num">${$f(covered)}</span> <span class="muted">of ${$f(c.totalNeed)}</span></div>
      <div class="facts"><div class="fact"><span>Debt + final expenses</span><b class="num">${$f(c.D)}</b></div><div class="fact"><span>Mortgage</span><b class="num">${$f(c.M)}</b></div><div class="fact"><span>Education fund</span><b class="num">${$f(c.E)}</b></div><div class="fact"><span>Income replaced</span><b>${c.yrs} years</b></div><div class="fact"><span>Liquid assets counted</span><b class="num">${$f(c.liquid)}</b></div><div class="fact"><span>Existing insurance</span><b class="num">${$f(sum(c.people.map(x=>x.cover)))}</b></div></div></div></div></div>
    <div class="s5" style="display:grid;gap:14px"><h3>DIME need vs. what's covered</h3>${dimeChart(c)}</div></div></section>
  <div class="goals" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${c.people.map(x=>{ const r=x.need?clamp((x.need-x.gap)/x.need):1, [t,l]=goalTone(r); return `<div class="gcard"><div class="gh"><span class="chip-ic gold">${icon("users",16)}</span><b>${esc(x.who)}</b>${pill(t,l)}</div>
    <div class="gv"><span class="num"><b>${$k(x.need-x.gap)}</b> <span class="muted">/ ${$k(x.need)}</span></span><span class="serif">${Math.round(r*100)}%</span></div><div class="bar"><i class="${t}" style="width:${r*100}%"></i></div>
    <div class="facts"><div class="fact"><span>Income replaced</span><b class="num">${$f(x.I)}</b></div><div class="fact"><span>Insurance today</span><b class="num">${$f(x.cover)}</b></div><div class="fact"><span>Gap</span><b class="num ${x.gap?"neg":"pos"}">${$f(x.gap)}</b></div><div class="fact"><span>Est. 20-yr term*</span><b class="num">${x.gap?$f(termEstimate(x.gap,x.age))+"/mo":"—"}</b></div></div>
    <div class="note">${x.gap?`A ${x.age<50?"20- or 30-year term":"term or guaranteed"} policy for about ${$k(Math.ceil(x.gap/50000)*50000)} would close this gap.`:"Fully protected."}</div></div>`; }).join("")}</div>
  <div class="grid12">
    <section class="card s7"><div class="ch"><h3>Policies in force</h3><button class="btn btn-ghost btn-sm" data-go="4">${icon("plus",14)} Add policy</button></div>
      ${pols.length?`<div class="tbl"><table><thead><tr><th>Insured</th><th>Type</th><th class="r">Death benefit</th><th class="r">Premium</th><th class="r">Years left</th><th>Note</th></tr></thead><tbody>${pols.map(p=>`<tr><td><b>${esc(nm(p.owner))}</b></td><td><span class="tag">${esc(p.type)}</span></td><td class="r num"><b>${$f(p.face)}</b></td><td class="r num">${p.premium?$f(p.premium)+"/mo":"—"}</td><td class="r num">${p.type==="Term"?(p.yearsLeft||"—"):"—"}</td><td>${flag(p)}</td></tr>`).join("")}
      <tr class="total"><td>Total</td><td></td><td class="r num">${$f(sum(pols.map(p=>p.face)))}</td><td class="r num">${$f(sum(pols.map(p=>p.premium)))}/mo</td><td></td><td></td></tr></tbody></table></div>`:`<p class="muted">No life insurance policies entered.</p>`}
      <div class="facts f3"><div class="fact"><span>Disability coverage</span>${S.insurance.disability?pill("good","In place"):pill("bad","None")}</div><div class="fact"><span>Health insurance</span>${S.insurance.health?pill("good","In place"):pill("bad","None")}</div><div class="fact"><span>Long-term care</span>${S.insurance.ltc?pill("good","In place"):pill("na","None")}</div></div></section>
    <section class="card s5"><h3>How DIME is calculated</h3><ol style="margin:0;padding-left:18px;display:grid;gap:8px;font-size:13.5px;color:var(--ink2)">
      <li><b>Debt</b>: credit cards, auto, student and other loans, plus final expenses (${$f(c.D)}).</li><li><b>Income</b>: each earner's income × ${c.yrs} years so the family can keep living.</li><li><b>Mortgage</b>: pay off the home so the family can stay (${$f(c.M)}).</li><li><b>Education</b>: ${$f(S.dime.eduPerChild)} per child × ${c.kids.length} (${$f(c.E)}).</li><li>Then subtract liquid assets (${$f(c.liquid)}) and existing insurance to find the gap.</li></ol>
      ${gapAll?`<div class="card tint-gold" style="box-shadow:none;padding:18px"><h3 class="serif" style="font-size:19px">Scenario: close the gap</h3><p style="font-size:13.5px">${c.people.filter(x=>x.gap).map(x=>`${esc(x.who)}: about ${$k(Math.ceil(x.gap/50000)*50000)} of term coverage, roughly ${$f(termEstimate(x.gap,x.age))}/mo`).join(". ")}. Together about <b>${$f(sum(c.people.map(x=>x.gap?termEstimate(x.gap,x.age):0)))}/month</b>, ${pct(sum(c.people.map(x=>x.gap?termEstimate(x.gap,x.age):0))/(c.budget||1))} of your plan budget.</p><p class="hint">*Rough estimate for a healthy non-smoker; actual premiums depend on health, age and carrier.</p></div>`:""}</section>
  </div></div>`; }

function pageGoals(){
  if(!hasData()) return emptyState();
  const c=calc(), yr=new Date().getFullYear(), r=c.retTarget?Math.min(1,c.retProj/c.retTarget):1;
  const rows=[[`Retirement at ${S.retirement.retireAge}`,c.retTarget,c.retProj,c.retExtra+(+S.retirement.monthly||0)+c.match,(+S.retirement.monthly||0)+c.match,yr+c.yRet,r]];
  c.ckids.forEach(k=>rows.push([`College: ${k.name}`,k.target,k.proj,k.monthly+k.monthlyNeed,k.monthly,yr+k.yTo,k.target?Math.min(1,k.proj/k.target):1]));
  const efNeed=Math.max(0,c.efTarget-(+S.assets.cash||0)); const efAct=c.actions.find(a=>a.key==="ef");
  rows.push(["Emergency fund",c.efTarget,+S.assets.cash||0,efAct?efAct.amt:0,efAct?efAct.funded:0,yr+Math.ceil((c.H||12)/12),c.efTarget?Math.min(1,(+S.assets.cash||0)/c.efTarget):1]);
  return `<div style="display:grid;gap:22px">
  <div class="summary-line"><span>${rows.length} long-term goals · <b>${$f(sum(rows.map(x=>Math.min(x[2],x[1]))))}</b> projected of ${$f(sum(rows.map(x=>x[1])))}</span><span>Planned <b>${$f(sum(rows.map(x=>x[4])))}</b>/mo · Required <b class="neg">${$f(sum(rows.map(x=>x[3])))}</b>/mo</span></div>
  <section class="card"><div class="grid12" style="align-items:center">
    <div class="s3" style="display:grid;justify-items:center;gap:12px">${ring(r,190,"on track")}${pill(goalTone(r)[0],goalTone(r)[1])}</div>
    <div class="s4" style="display:grid;gap:14px"><div style="display:flex;gap:10px;align-items:center"><span class="chip-ic gold">${icon("trend",16)}</span><h2 class="serif" style="font-size:26px">Retirement at ${S.retirement.retireAge}</h2></div>
      <div><span class="big num">${$f(c.retProj)}</span> <span class="muted">of ${$f(c.retTarget)}</span></div>
      <div class="facts"><div class="fact"><span>Saved today</span><b class="num">${$f(S.assets.retirement)}</b></div><div class="fact"><span>Years to go</span><b>${c.yRet}</b></div><div class="fact"><span>Monthly now</span><b class="num">${$f((+S.retirement.monthly||0)+c.match)}</b></div><div class="fact"><span>Extra needed</span><b class="num ${c.retExtra?"neg":"pos"}">${$f(c.retExtra)}/mo</b></div><div class="fact"><span>Desired income</span><b class="num">${$f(c.desired)}/mo</b></div><div class="fact"><span>Social Security + pension</span><b class="num">${$f(S.retirement.ssMonthly)}/mo</b></div></div>
      <span class="hint">Accounts: ${esc((S.retirement.accounts||[]).join(", ")||"none entered")}</span></div>
    <div class="s5" style="display:grid;gap:10px"><div class="ch"><h3>Projected vs. needed savings</h3><div class="legend"><span><i style="background:var(--c2)"></i>Projected</span><span><i style="background:var(--gold)"></i>Needed</span></div></div>${retChart(c)}</div></div></section>
  <div class="goals">${c.ckids.map(k=>{ const rr=k.target?Math.min(1,k.proj/k.target):1,[t,l]=goalTone(rr); return `<div class="gcard"><div class="gh"><span class="chip-ic gold">${icon("cap",16)}</span><b>${esc(k.name)}'s college</b>${pill(t,l)}</div>
    <div class="gv"><span class="num"><b>${$k(k.proj)}</b> <span class="muted">/ ${$k(k.target)}</span></span><span class="serif">${Math.round(rr*100)}%</span></div><div class="bar"><i class="${t}" style="width:${rr*100}%"></i></div>
    <div class="facts"><div class="fact"><span>Plan</span><b>${esc(k.type)}</b></div><div class="fact"><span>College starts</span><b>${yr+k.yTo}</b></div><div class="fact"><span>Needed / mo</span><b class="num">${$f(k.monthly+k.monthlyNeed)}</b></div><div class="fact"><span>Planned / mo</span><b class="num">${$f(k.monthly)}</b></div></div>
    <div class="note">${k.gap?(k.type==="None yet"?`Open a 529 plan and add about ${$f(k.monthlyNeed)}/mo.`:`Add ${$f(k.monthlyNeed)}/mo to stay on track.`):"On track for year one."}</div></div>`; }).join("")}
    ${(()=>{ const rr=c.efTarget?Math.min(1,(+S.assets.cash||0)/c.efTarget):1,[t,l]=goalTone(rr); return `<div class="gcard"><div class="gh"><span class="chip-ic gold">${icon("umbrella",16)}</span><b>Emergency fund</b>${pill(t,l)}</div><div class="gv"><span class="num"><b>${$k(S.assets.cash)}</b> <span class="muted">/ ${$k(c.efTarget)}</span></span><span class="serif">${Math.round(rr*100)}%</span></div><div class="bar"><i class="${t}" style="width:${rr*100}%"></i></div><div class="facts"><div class="fact"><span>Months saved</span><b>${c.emMonths.toFixed(1)}</b></div><div class="fact"><span>Still needed</span><b class="num">${$f(efNeed)}</b></div></div><div class="note">Six months of expenses in a high-yield savings account.</div></div>`; })()}
    ${(()=>{ const rr=c.estDone/c.estItems.length,[t,l]=goalTone(rr); return `<div class="gcard"><div class="gh"><span class="chip-ic gold">${icon("scroll",16)}</span><b>Estate plan</b>${pill(t,l)}</div><div class="gv"><span class="num"><b>${c.estDone}</b> <span class="muted">/ ${c.estItems.length} documents</span></span><span class="serif">${Math.round(rr*100)}%</span></div><div class="bar"><i class="${t}" style="width:${rr*100}%"></i></div><div style="display:grid;gap:6px;font-size:13px">${c.estItems.map(([k2,tt])=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${tt}</span>${S.estate[k2]?pill("good","Done"):pill("bad","To do")}</div>`).join("")}</div></div>`; })()}
  </div>
  <section class="card"><div class="ch"><h3>Goal achievement</h3><span class="muted" style="font-size:12.5px">Required ${$f(sum(rows.map(x=>x[3])))}/mo · planned ${$f(sum(rows.map(x=>x[4])))}/mo</span></div>
    <div class="tbl"><table><thead><tr><th>Goal</th><th class="r">Target</th><th class="r">Projected</th><th class="r">Required / mo</th><th class="r">Planned / mo</th><th>Target year</th><th>Status</th></tr></thead><tbody>
    ${rows.map(([g,t,p,req,pl,y,rr])=>{ const [tt,l]=goalTone(rr); return `<tr><td><b>${esc(g)}</b></td><td class="r num">${$f(t)}</td><td class="r num">${$f(p)}</td><td class="r num">${$f(req)}</td><td class="r num ${pl>=req-1?"pos":""}"><b>${$f(pl)}</b></td><td>${y}</td><td>${pill(tt,l)}</td></tr>`; }).join("")}</tbody></table></div></section>
  <p class="disc">Projections assume ${RATE*100}% annual growth, ${INFL*100}% inflation, ${EDU_INFL*100}% college cost inflation and the 4% withdrawal rule. Not guaranteed; not financial advice.</p></div>`; }

      <div style="display:flex;gap:8px;flex-wrap:wrap">${pill(nw.debts/(nw.assets||1)<.5?"good":"warn",`Debt-to-asset ${pct(nw.debts/(nw.assets||1))}`)}${pill("na",`Liquid ${$k(liq)}`)}</div>

  <div class="grid12">
    <section class="card s8"><div class="ch"><h3>Assets</h3><button class="btn btn-ghost btn-sm" data-go="3">${icon("plus",14)} Edit assets</button></div>
      <div class="tbl"><table><thead><tr><th>Name</th><th>Type</th><th>Tax treatment</th><th class="r">Current value</th><th class="r">Share</th></tr></thead><tbody>
      ${nw.aList.map(([l,v,col,t,tx])=>`<tr><td><b>${l}</b>${l==="Retirement accounts"?`<div class="hint">${esc((S.retirement.accounts||[]).join(", "))}</div>`:""}</td><td class="muted">${t}</td><td><span class="tag">${tx}</span></td><td class="r num"><b>${$f(v)}</b></td><td class="r num muted">${(v/(nw.assets||1)*100).toFixed(1)}%</td></tr>`).join("")}
